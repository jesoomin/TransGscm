# [초안 - docs/09-common-response-convention.md 참고] GlobalExceptionHandler가 쓰는 MessageSource가
# message/errors(.properties/_en.properties)를 읽도록 지정한다. 그 외 DB 접속 등은 아직 없음 -
# 로컬 개발 DB 접속정보는 CLAUDE.md 원칙대로 이 파일에 직접 적지 않는다(.env/별도 secrets 관리 필요).
spring.messages.basename=message/errors
spring.messages.encoding=UTF-8
