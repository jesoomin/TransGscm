# E0052: generic error code used in AS-IS NEXCORE code whenever an unexpected exception was
# caught (confirmed in real source, e.g. FPLA047.java: catch(Exception e){ throw new
# BizRuntimeException("E0052", e); }). The original NEXCORE message text for this code has not
